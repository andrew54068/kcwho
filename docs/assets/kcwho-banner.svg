<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">kcwho — See who’s asking.</title>
  <desc id="desc">Read-only diagnostics for macOS Keychain requests. Inspect the direct requester, PID, executable path, and signing status. A keyhole inside an observation lens represents visibility, not approval.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#14272F"/><stop offset=".5" stop-color="#0C1D25"/><stop offset="1" stop-color="#07171E"/></linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(1250 272) rotate(90) scale(350 470)" gradientUnits="userSpaceOnUse"><stop stop-color="#6DD4B3" stop-opacity=".09"/><stop offset="1" stop-color="#6DD4B3" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="1090" y1="91" x2="1457" y2="457" gradientUnits="userSpaceOnUse"><stop stop-color="#E1FFF2"/><stop offset=".38" stop-color="#B2F2D6"/><stop offset=".72" stop-color="#6ACDB5"/><stop offset="1" stop-color="#42A791"/></linearGradient>
    <linearGradient id="glass" x1="1087" y1="114" x2="1320" y2="392" gradientUnits="userSpaceOnUse"><stop stop-color="#345A5E"/><stop offset=".52" stop-color="#183A42"/><stop offset="1" stop-color="#102B33"/></linearGradient>
    <linearGradient id="keyhole" x1="1187" y1="174" x2="1252" y2="331" gradientUnits="userSpaceOnUse"><stop stop-color="#F3FFF7"/><stop offset="1" stop-color="#B5F3D6"/></linearGradient>
    <linearGradient id="rule" x1="80" y1="441" x2="808" y2="441" gradientUnits="userSpaceOnUse"><stop stop-color="#4D6A71"/><stop offset="1" stop-color="#4D6A71" stop-opacity=".15"/></linearGradient>
    <filter id="shadow" x="992" y="66" width="537" height="471" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="frame"><rect width="1600" height="560" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="560" fill="url(#background)"/>
    <rect x="780" width="820" height="560" fill="url(#ambient)"/>
